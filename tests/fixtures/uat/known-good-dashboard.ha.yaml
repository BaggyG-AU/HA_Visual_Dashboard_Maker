# Home Assistant export summary (HAVDM):
# - 1 card can't run in Home Assistant and was replaced with a "Card Not Available" placeholder.
title: New Dashboard
views:
  - title: Home
    path: home
    cards:
      - type: tile
        entity: cover.garage_door
        name: Garage Door
        view_layout:
          grid_column: 1 / 5
          grid_row: 1 / 3
      - type: button
        entity: switch.garage_lamp
        name: Garage Lamp
        show_state: true
        view_layout:
          grid_column: 1 / 4
          grid_row: 3 / 5
      - type: weather-forecast
        entity: weather.mckenzie_hill
        forecast_type: daily
        show_current: true
        show_forecast: true
        view_layout:
          grid_column: 1 / 7
          grid_row: 5 / 12
      - type: custom:mushroom-person-card
        entity: person.micah
        view_layout:
          grid_column: 1 / 7
          grid_row: 12 / 19
      - type: markdown
        content: >-
          ## ⚠️ Card Not Available


          The **popup** card is a HAVDM design-only card with no Home Assistant equivalent, so it can't be deployed.
          This placeholder holds its place.
        view_layout:
          grid_column: 1 / 7
          grid_row: 19 / 26
  - title: Energy
    path: energy
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Solar & Battery
            heading_style: title
          - type: gauge
            entity: sensor.sigen_plant_battery_state_of_charge
            name: Battery
            min: 0
            max: 100
            needle: true
          - type: tile
            entity: sensor.sigen_plant_pv_power
            name: Solar Power
      - type: grid
        cards:
          - type: heading
            heading: Vehicle & Grid
            heading_style: title
          - type: tile
            entity: sensor.ev5_ev_battery_level
            name: EV Battery
          - type: gauge
            entity: sensor.home_renewables
            name: Renewables
            min: 0
            max: 100
    max_columns: 4
