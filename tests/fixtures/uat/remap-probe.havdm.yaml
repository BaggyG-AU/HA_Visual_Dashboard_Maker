# FR-04 companion probe — a CONTROLLED input for the entity-remapping dialog.
#
# ⚠ THIS FILE IS NOT THE KNOWN-GOOD DASHBOARD, AND IT IS NOT MEANT TO DEPLOY.
# It exists for one reason: round-3 defect HA-04 could not be judged, because the
# missing entity in the tester's own file was `input_boolean.toggle` — which does
# not exist AND is not a plausible rename of any of the six real `input_boolean`
# entities. The auto-mapper declining it was CORRECT behaviour, so the card
# measured nothing. HA-04's round-3 card correction told the TESTER to supply a
# plausible rename, but the entity came from their own file rather than from a
# step they performed, so the correction could never bind. A controlled input is
# the only thing that closes that loop.
#
# ⭐ THE PROPERTY THIS FILE PROVIDES: `sensor.sigen_plant_pv_power_old` does NOT
# exist on the instance, while `sensor.sigen_plant_pv_power` — the same id
# without the `_old` suffix — DOES. So the auto-mapper has something it SHOULD
# match at a high score, and "it offered nothing" becomes a real result rather
# than a correct refusal. The second card holds an entity that exists, so the
# dialog has a control case in the same file.
#
# ⚠ Hand-authored ON PURPOSE, unlike `known-good-dashboard.havdm.yaml`, which is
# generated by driving the app (`tests/e2e/uat-known-good-dashboard.spec.ts`).
# This file is an INPUT to a dialog, not an artifact of HAVDM's export, so there
# is nothing about HAVDM's own output for it to attest to. It is still asserted
# to load through the real parse path in
# `tests/unit/uat-known-good-dashboard.spec.ts`.
title: HAVDM UAT Remap Probe
views:
  - title: Remap
    path: remap
    type: masonry
    cards:
      - type: tile
        entity: sensor.sigen_plant_pv_power_old
        name: Solar Power (renamed)
      - type: tile
        entity: sensor.sigen_plant_battery_state_of_charge
        name: Battery (unchanged)
