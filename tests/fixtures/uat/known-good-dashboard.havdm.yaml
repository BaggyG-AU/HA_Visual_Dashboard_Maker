title: New Dashboard
views:
  - title: Home
    path: home
    type: custom:grid-layout
    layout:
      grid_template_columns: repeat(12, 1fr)
      grid_template_rows: repeat(auto-fill, 56px)
      grid_gap: 8px
    _havdm_scaffold: true
    cards:
      - type: tile
        entity: cover.garage_door
        name: Garage Door
        _havdm_layout:
          x: 0
          'y': 0
          w: 4
          h: 2
        view_layout:
          grid_column: 1 / 5
          grid_row: 1 / 3
      - type: button
        entity: switch.garage_lamp
        name: Garage Lamp
        show_state: true
        _havdm_layout:
          x: 0
          'y': 2
          w: 3
          h: 2
        view_layout:
          grid_column: 1 / 4
          grid_row: 3 / 5
      - type: weather-forecast
        entity: weather.mckenzie_hill
        forecast_type: daily
        show_current: true
        show_forecast: true
        _havdm_layout:
          x: 0
          'y': 4
          w: 6
          h: 7
        view_layout:
          grid_column: 1 / 7
          grid_row: 5 / 12
      - type: custom:mushroom-person-card
        entity: person.micah
        _havdm_layout:
          x: 0
          'y': 11
          w: 6
          h: 7
        view_layout:
          grid_column: 1 / 7
          grid_row: 12 / 19
      - type: custom:popup-card
        title: Popup Trigger
        trigger_label: Open Popup
        trigger_icon: mdi:open-in-new
        popup:
          title: Details
          size: medium
          close_on_backdrop: true
          backdrop_opacity: 0.45
          show_header: true
          show_footer: false
          close_label: Close
          footer_actions: []
          cards:
            - type: markdown
              content: Popup content
        _havdm_layout:
          x: 0
          'y': 18
          w: 6
          h: 7
        view_layout:
          grid_column: 1 / 7
          grid_row: 19 / 26
  - title: Energy
    path: energy
    type: sections
    _havdm_scaffold: true
    cards: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Solar & Battery
            heading_style: title
          - type: gauge
            entity: sensor.sigen_plant_battery_state_of_charge
            name: Battery
            min: 0
            max: 100
            needle: true
          - type: tile
            entity: sensor.sigen_plant_pv_power
            name: Solar Power
      - type: grid
        cards:
          - type: heading
            heading: Vehicle & Grid
            heading_style: title
          - type: tile
            entity: sensor.ev5_ev_battery_level
            name: EV Battery
          - type: gauge
            entity: sensor.home_renewables
            name: Renewables
            min: 0
            max: 100
    max_columns: 4
