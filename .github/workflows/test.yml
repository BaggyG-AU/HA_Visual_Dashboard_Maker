name: Regression Suites

# TIER 2 (pre-merge, on demand) and TIER 3 (nightly) of the test regime.
# Tier 0 is `./tools/checks` locally; tier 1 is .github/workflows/ci.yml.
#
# ⚠⚠ HISTORY, SO IT IS NOT REPEATED. The previous version of this file ran
# nightly and was BROKEN FOR SEVEN MONTHS WITHOUT ANYONE NOTICING — 168 runs,
# 160 cancelled, last success 2026-01-09. Three independent causes, all fixed
# here, all worth stating because each is easy to reintroduce:
#
#   1. `timeout-minutes: 30` against a suite that needed longer. Run
#      31732899567 reached test 277 of 325 and was guillotined. Now the work is
#      SHARDED so no single job carries the whole suite, and the timeout is 60.
#   2. `runs-on: windows-latest`, while all 51 committed baseline PNGs carry the
#      `-linux` suffix. Playwright looked for `-win32` files that do not exist —
#      37 `A snapshot doesn't exist` errors per run. Now: ubuntu-latest.
#   3. `continue-on-error: true` on the test steps, which meant the job could
#      never go red. The alarm was wired to nothing.
#
# ⚠ ON (3) AND WHY `continue-on-error` STILL APPEARS BELOW. This project has
# SEVEN long-standing e2e failures that are recorded and not yet fixed, so a
# raw Playwright exit code cannot express "correct". The authority on pass/fail
# is `tools/check-suite-signatures.cjs`, which compares the SET of failures (and
# their reason classes, and the report's size) against
# tests/baseline/expected-failures.json. `continue-on-error` therefore sits on
# the shard TEST steps only — to let every shard finish and reach the merge —
# and NEVER on the signature check, which is what turns this workflow red.

on:
  schedule:
    # 18:00 UTC daily. Tier 3.
    - cron: '0 18 * * *'
  workflow_dispatch:
  pull_request:
    # ⚠⚠ M5 (Codex round 1): `synchronize` was missing, so once a PR was labelled
    # or marked ready, EVERY LATER COMMIT went un-covered by tier 2 — the safety
    # net that tier 1's heuristic selection is justified by never ran at the head
    # being merged. `synchronize` fires on each push to the PR branch; the job
    # condition below requires the `full-suite` label to still be present, so this
    # does not spend twenty minutes on unlabelled PRs.
    types: [labeled, synchronize, ready_for_review]

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

env:
  # ⚠⚠ THESE ARE FLOORS ON **EXECUTED** OUTCOMES, NOT ON TEST IDENTITIES.
  # Codex round-1 finding M1 measured both halves of the old design failing:
  #   - counting identities let 560 of 561 outcomes be SKIPPED and still pass;
  #   - the deliberate slack (550 against a live 561) accepted 11 physically
  #     missing outcomes, and 18 against 19 accepted one.
  # Both are closed. The checker now counts only non-skipped outcomes, skips are
  # constrained by IDENTITY in tests/baseline/expected-failures.json, and the
  # slack is gone: these are the EXACT live executed counts, measured from run
  # 31802864528 (behavioural 541 executed of 561 identities with 20 skipped;
  # visual 18 executed of 19 with 1 skipped).
  #
  # ⭐ A floor is a MINIMUM, so adding tests never breaks it. REMOVING a test
  # does, deliberately — that is the point. Bump these in the same commit that
  # removes a test, and never to make a red run green.
  BEHAVIOURAL_MIN_TESTS: 541
  VISUAL_MIN_TESTS: 18

jobs:
  # ---------------------------------------------------------------- TIER 2 ---
  behavioural:
    name: behavioural ${{ matrix.shardIndex }}/4
    # Nightly and manual always run. On a PR this is opt-in, so an ordinary
    # push does not spend twenty minutes of runner time nobody asked for.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-suite') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'full-suite'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One shard failing must not cancel the others — a partial result is
      # useless to the signature check, which needs the whole population.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright system dependencies
        run: npx playwright install-deps
      # Required, not optional — see the long note in ci.yml: specs that
      # destructure the built-in `page` fixture launch a real Chromium even
      # though they immediately discard it and use launchWithDSL().
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build application
        run: npm run package
      # Both Playwright projects in ONE invocation so `--shard` balances across
      # the combined population rather than sharding each project separately.
      - name: Run behavioural suites (shard ${{ matrix.shardIndex }}/4)
        continue-on-error: true # see the header note — the signature check decides
        run: >-
          bash tools/test-headless.sh
          --project=electron-e2e
          --project=electron-integration
          --grep-invert @visual
          --shard=${{ matrix.shardIndex }}/4
          --workers=1
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioural-artifacts-${{ matrix.shardIndex }}
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 7

  merge:
    name: merge + signature check
    needs: [behavioural]
    if: always() && needs.behavioural.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into a single JSON report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: npx playwright merge-reports --reporter json ./all-blob-reports
      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      # ⚠ NO continue-on-error. This step is the gate.
      - name: Check failures against the baseline manifest
        run: >-
          node tools/check-suite-signatures.cjs
          --report merged-results.json
          --tier behavioural
          --min-tests ${{ env.BEHAVIOURAL_MIN_TESTS }}
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-report-${{ github.run_number }}
          path: |
            merged-results.json
            playwright-report/
          retention-days: 30

  # ---------------------------------------------------------------- TIER 3 ---
  # ⚠⚠ THIS JOB IS AN EXPERIMENT BEFORE IT IS A GATE, AND IT IS NON-BLOCKING ON
  # PURPOSE. The 51 committed baselines were generated on the maintainer's
  # WSL2 + Xvfb box. GitHub's Ubuntu is a DIFFERENT Linux with a different font
  # stack, and NOBODY HAS EVER MEASURED whether the two render identically. Its
  # first runs answer that question:
  #   - only the six canonical visual signatures reproduce -> visual works in CI
  #   - unrelated specs diff too                           -> the environments
  #     disagree, and the follow-up choice is a pinned Playwright Docker image
  #     (mcr.microsoft.com/playwright) versus keeping visual local-only.
  # ⚠⚠ NOTHING HERE RE-BASELINES ANYTHING. A snapshot update needs a cause and
  # the owner's authorisation.
  #
  # Un-sharded and --workers=1 by necessity, not preference: popup.visual
  # measured 158,669 differing pixels under full-suite load against 16,372
  # ISOLATED on identical code. Sharing a runner would manufacture false diffs.
  visual:
    name: visual (non-blocking experiment)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-suite') ||
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'full-suite'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright system dependencies
        run: npx playwright install-deps
      # Required, not optional — see the long note in ci.yml: specs that
      # destructure the built-in `page` fixture launch a real Chromium even
      # though they immediately discard it and use launchWithDSL().
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build application
        run: npm run package
      # Not sharded, so it needs no blob/merge round trip — the JSON reporter
      # writes the report the signature check reads. `--reporter` overrides the
      # `blob` that playwright.config.ts selects under CI.
      - name: Run visual suite
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results.json
        run: >-
          bash tools/test-headless.sh
          --project=electron-e2e
          --grep @visual
          --workers=1
          --reporter=json
      - name: Check visual failures against the baseline manifest
        continue-on-error: true # experiment, not yet a gate — see the note above
        run: >-
          node tools/check-suite-signatures.cjs
          --report visual-results.json
          --tier visual
          --min-tests ${{ env.VISUAL_MIN_TESTS }}
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts-${{ github.run_number }}
          path: |
            visual-results.json
            test-results/
            !test-results/**/*.zip
          retention-days: 30
  # ⭐ AUTHORISED BY THE OWNER 2026-08-14. `ai_rules.md` §3.5 forbids the AGENT
  # creating GitHub issues without authorisation; the owner ruled explicitly
  # that this workflow may. That ruling covers this job and nothing else — it is
  # not a general licence for an agent to open issues by hand.
  #
  # ⚠ SCHEDULE ONLY. A manual `workflow_dispatch` or a PR run that goes red must
  # NOT open an issue: those have a human watching them already, and issue spam
  # is the fastest way to make this signal ignored — which is precisely how the
  # old nightly died.
  #
  # ⚠ ONE ISSUE, REOPENED AND COMMENTED, NEVER ONE PER NIGHT. A nightly that
  # stays red for a week should produce one thread with seven comments, not
  # seven threads.
  notify:
    name: report a red nightly
    needs: [merge]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'Nightly regression suite is red';
            const LABEL = 'nightly-failure';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly regression suite failed.`,
              ``,
              `- Run: ${url}`,
              `- Commit: \`${context.sha}\``,
              ``,
              `The **merge + signature check** job is the authority: it compares the`,
              `failure set, each failure's reason class, and the report size against`,
              '`tests/baseline/expected-failures.json`.',
              ``,
              `⚠ Triage on SIGNATURES, never counts, and re-baselining a snapshot needs`,
              `a cause and the owner's authorisation.`,
            ].join('\n');

            // ⚠⚠ M6 (Codex round 1): this searched and created by a label that
            // DOES NOT EXIST in the repository — `gh label list --search
            // nightly-failure` returned []. GitHub requires a label to exist
            // before a workflow can assign it, so the FIRST red nightly could not
            // create the very issue every later deduplication depends on.
            // Provision it idempotently; a 422 means someone else just made it.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
                color: 'B60205',
                description: 'Opened automatically when the nightly regression suite goes red.',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            // ⚠ M6, second half: the lookup took only the first 20 matches and did
            // not paginate, so once the canonical issue fell off page one the
            // "one issue, never one per night" invariant would start creating
            // duplicates. `paginate` walks every page.
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: LABEL,
              per_page: 100,
            });
            const found = all.find((i) => i.title === TITLE);

            if (!found) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: [LABEL],
              });
              return;
            }
            if (found.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: found.number,
              body,
            });
