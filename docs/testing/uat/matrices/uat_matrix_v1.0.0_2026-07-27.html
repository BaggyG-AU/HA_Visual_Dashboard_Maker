  If this matrix and that plan disagree, the plan is right.

  ⚠ THIS ROUND RUNS ON WINDOWS. Launch the packaged

  Governed by: docs/testing/UAT_STRATEGY.md
  Generated by: prompts/claude/uat-plan-and-matrix.md

  TEST TYPES (UAT_STRATEGY.md §4):
    gate test    AUTO ✓ : an automated spec proves the logic; you verify the
                          observable behaviour the spec cannot see.
    edge case            : no automated coverage. Your steps are the only evidence.
    interaction          : live application workflow — packaging, menus, dialogs.
    fidelity             : does the generated HA config render correctly, and does
                           HAVDM honestly mark what it could not translate?

  EXTENSION FIELDS (document any new one HERE before first use):
    auto_covered : Boolean — true shows the AUTO ✓ badge and the note banner
    auto_note    : String  — required when auto_covered. Names the spec.
    isNew        : Boolean — "new" badge, first appearance in any round
    defect       : String  — e.g. "#142". Regression-recheck badge.
    needsHA      : Boolean — "live HA" badge. Triggers the teardown gate.

  AFTER THE ROUND:
    1. Click "Generate Test Summary Report" -> commit to docs/testing/uat/reports/

    <script>
      /* ============================================================
     CONFIG — replace these four constants per round.
     ============================================================ */
      const ROUND_ID = 'v1.0.0';
      const ROUND_KEY = 'v1_0_0';
      const ROUND_NAME = 'First stable release';
      const BUILD_UNDER_TEST =
        'Windows x64 packaged app — HA Visual Dashboard Maker.exe (source tree unchanged since 7c49ae0)';

      const REPO = 'BaggyG-AU/HA_Visual_Dashboard_Maker';
      const PLAN_PATH = `docs/testing/uat/plans/uat_plan_${ROUND_ID}_2026-07-27.md`;

      /* ============================================================
     PREV — prior round results, from the last session JSON's
     `current` map. This is ROUND 1: there is no prior session, so
     PREV is empty and every previous-round dot is grey.
     ============================================================ */
      const PREV = {};

      /* ============================================================
     TESTS — 66 cards. Generated from the plan; see the header
     comment for the full field list.
     ============================================================ */
      const TESTS = [
        {
          id: 'SHELL-01',
          name: 'The packaged application launches and presents the welcome screen',
          type: 'interaction',
          auto_covered: true,
          isNew: true,
          auto_note:
            '<code>tests/e2e/app-launch.spec.ts</code> asserts the window opens at the right dimensions, the main UI mounts and no critical console errors appear — but it drives a <em>development</em> build, so it has never once launched the artifact a user installs. You are checking the packaged binary.',
          steps: [
            'Launch <code>HA Visual Dashboard Maker.exe</code> from the copied <code>HA Visual Dashboard Maker-win32-x64</code> folder.',
            'Wait for the window to finish painting.',
            'Read the window title bar and the header.',
            'Look at the left sidebar and the connection badge at the top right.',
          ],
          expects: [
            'A single window opens and stays open; nothing flashes blank or white.',
            'The header reads <strong>HA Visual Dashboard Maker</strong>.',
            'The welcome screen offers <strong>New Dashboard</strong>, <strong>Open Local File</strong> and <strong>Browse HA Dashboards</strong>.',
            'The <strong>Card Palette</strong> sidebar is present on the left.',
            'The badge at the top right reads <strong>Not Connected</strong>.',
          ],
        },
        {
          id: 'SHELL-02',
          name: 'The application menu exposes every top-level operation',
          type: 'interaction',
          auto_covered: true,
          isNew: true,
          auto_note:
            '<code>tests/unit/menu.spec.ts</code> asserts the File menu carries an "Export for Home Assistant..." item wired to its own channel, and that Save and Save As... stay distinct raw actions. It builds the menu in memory; it never opens a real native menu in a packaged window.',
          steps: [
            'Open the File menu and read every item.',
            'Open the Edit, View, Window and Help menus in turn.',
            'In the File menu, hover Recent Files.',
            'Dismiss the menu with Esc.',
          ],
          expects: [
            'File contains: Open Dashboard..., Save, Save As..., Export for Home Assistant..., Version Control..., Recent Files, and a quit or close item.',
            'Edit contains Undo, Redo, Cut, Copy, Paste.',

      /* ============================================================
     GROUPS — grouped by FEATURE AREA the user perceives. Everything
     needing a live Home Assistant connection is in group 11, the
     final group, so a round can complete without HA and Skip it
     cleanly.
     ============================================================ */
      const GROUPS = [
        {
          title: '1 — Application Shell &amp; First Run',
          ids: ['SHELL-01', 'SHELL-02', 'SHELL-03', 'SHELL-04'],
        },
        {
          title: '2 — Creating, Opening &amp; Saving Dashboards',
          ids: ['FILE-01', 'FILE-02', 'FILE-03', 'FILE-04', 'FILE-05', 'FILE-06'],

        },

          ids: ['PROPS-01', 'PROPS-02', 'PROPS-03', 'PROPS-04', 'PROPS-05', 'PROPS-06', 'PROPS-07'],
        },

          ids: ['EXPORT-01', 'EXPORT-02', 'EXPORT-03', 'EXPORT-04', 'EXPORT-05', 'EXPORT-06'],
        },
        {
          title: '9 — Themes &amp; Preset Marketplace',
          ids: ['THEME-01', 'THEME-02', 'THEME-03', 'THEME-04'],
        },
        {
          title: '10 — Version Control (read-only)',
          ids: ['VCS-01', 'VCS-02', 'VCS-03', 'VCS-04'],

        {
          title: '11 — ⚠ Live Home Assistant',
          ids: ['HA-01', 'HA-02', 'HA-03', 'HA-04', 'HA-05', 'HA-06', 'HA-07', 'HA-08', 'HA-09'],

      /* ============================================================
     Storage keys — unique per round so state cannot bleed across.
     ============================================================ */
      const KEY_CURRENT = `havdm_uat_${ROUND_KEY}_current`;
      const KEY_NOTES = `havdm_uat_${ROUND_KEY}_notes`;
      const KEY_SEVERITY = `havdm_uat_${ROUND_KEY}_severity`;
      const KEY_SCREENSHOTS = `havdm_uat_${ROUND_KEY}_screenshots`;
      const KEY_RUNS = `havdm_uat_${ROUND_KEY}_runs`;
      const KEY_TEARDOWN = `havdm_uat_${ROUND_KEY}_teardown`;

      let state = {};
      let notes = {};
      let severity = {};
      let screenshots = {};

      // ── Persistence ────────────────────────────────────────────
      function initState() {
        TESTS.forEach((t) => {
          state[t.id] = 'untested';
        });
        try {
          const saved = localStorage.getItem(KEY_CURRENT);
          if (saved) Object.assign(state, JSON.parse(saved));
          const savedNotes = localStorage.getItem(KEY_NOTES);
          if (savedNotes) Object.assign(notes, JSON.parse(savedNotes));
          const savedSev = localStorage.getItem(KEY_SEVERITY);
          if (savedSev) Object.assign(severity, JSON.parse(savedSev));
          const savedShots = localStorage.getItem(KEY_SCREENSHOTS);
          if (savedShots) Object.assign(screenshots, JSON.parse(savedShots));
        } catch (e) {
          console.warn('Could not restore saved state:', e);
        }
      }
      function persist(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          showToast('Storage full — export your JSON now. Screenshots are the usual cause.');
        }
      }
      const persistCurrent = () => persist(KEY_CURRENT, state);
      const persistNotes = () => persist(KEY_NOTES, notes);
      const persistSeverity = () => persist(KEY_SEVERITY, severity);
      const persistScreenshots = () => persist(KEY_SCREENSHOTS, screenshots);

      // ── Named runs ─────────────────────────────────────────────
      function loadRuns() {
        try {
          return JSON.parse(localStorage.getItem(KEY_RUNS) || '[]');
        } catch (e) {
          return [];
        }
      }
      function saveRuns(runs) {
        persist(KEY_RUNS, runs);
      }
      function countsByState(st) {
        const c = { pass: 0, fail: 0, skip: 0, untested: 0 };
        TESTS.forEach((t) => {
          c[st[t.id] || 'untested']++;
        });
        return c;
      }
      function saveCurrentRun(name) {
        const runs = loadRuns();
        runs.push({
          name: name || `Run ${runs.length + 1}`,
          saved: new Date().toISOString().slice(0, 16).replace('T', ' '),
          state: { ...state },
          notes: { ...notes },
          severity: { ...severity },
          screenshots: { ...screenshots },
          counts: countsByState(state),
        });
        saveRuns(runs);
        renderRunsList();
        showToast('Run saved.');
      }
      function deleteRun(idx) {
        const runs = loadRuns();
        runs.splice(idx, 1);
        saveRuns(runs);
        renderRunsList();
        showToast('Run deleted.');
      }
      function loadRun(idx) {
        const run = loadRuns()[idx];
        if (!run) return;
        if (!confirm(`Load "${run.name}"? This replaces your current results.`)) return;
        replaceAllState(run.state, run.notes, run.severity, run.screenshots);
        showToast(`Loaded "${run.name}".`);
      }
      function replaceAllState(newState, newNotes, newSeverity, newShots) {
        TESTS.forEach((t) => {
          state[t.id] = 'untested';
        });
        Object.assign(state, newState || {});
        Object.keys(notes).forEach((k) => delete notes[k]);
        Object.assign(notes, newNotes || {});
        Object.keys(severity).forEach((k) => delete severity[k]);
        Object.assign(severity, newSeverity || {});
        Object.keys(screenshots).forEach((k) => delete screenshots[k]);
        Object.assign(screenshots, newShots || {});
        persistCurrent();
        persistNotes();
        persistSeverity();
        persistScreenshots();
        render();
      }
      function renderRunsList() {
        const runs = loadRuns();
        const el = document.getElementById('saved-runs-list');
        if (!runs.length) {
          el.innerHTML = `<div style="font-size:12px;color:var(--color-text-secondary)">No saved runs yet.</div>`;
          return;
        }
        el.innerHTML = runs
          .map(
            (r, i) => `
        <div class="saved-run">
          <span><strong>${escHtml(r.name)}</strong> — ${r.saved}
            <span style="color:var(--color-text-secondary)">
              (${r.counts.pass}✓ ${r.counts.fail}✗ ${r.counts.skip}⊘ ${r.counts.untested}○)</span>
          </span>
          <span>
            <button class="runs-btn" data-load-run="${i}">Load</button>
            <button class="runs-btn btn-clear" data-del-run="${i}">Delete</button>
          </span>
        </div>`,
          )
          .join('');
        el.querySelectorAll('[data-load-run]').forEach((b) =>
          b.addEventListener('click', () => loadRun(+b.dataset.loadRun)),
        );
        el.querySelectorAll('[data-del-run]').forEach((b) =>
          b.addEventListener('click', () => deleteRun(+b.dataset.delRun)),
        );
      }

      // ── Export / import ────────────────────────────────────────
      function exportJSON() {
        const payload = {
          exported: new Date().toISOString(),
          round: ROUND_ID,
          roundName: ROUND_NAME,
          buildUnderTest: BUILD_UNDER_TEST,
          current: { ...state },
          currentNotes: { ...notes },
          currentSeverity: { ...severity },
          currentScreenshots: { ...screenshots },
          teardownConfirmed: localStorage.getItem(KEY_TEARDOWN) === 'true',
          runs: loadRuns(),
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `uat_session_${ROUND_ID}_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast('Session JSON exported — commit it to docs/testing/uat/sessions/');
      }

      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            replaceAllState(
              data.current || {},
              data.currentNotes || {},
              data.currentSeverity || {},
              data.currentScreenshots || {},
            );
            if (Array.isArray(data.runs)) saveRuns(data.runs);
            renderRunsList();
            showToast('Session imported.');
          } catch (err) {
            showToast('Could not read that file — is it a UAT session JSON?');
          }
        };
        reader.readAsText(file);
      }

      // ── Helpers ────────────────────────────────────────────────
      function escHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function typeBadgeClass(type) {
        return (
          {
            gate: 'badge-gate',
            edge: 'badge-edge',
            interaction: 'badge-interaction',
            fidelity: 'badge-fidelity',
          }[type] || 'badge-gate'
        );
      }
      function typeLabel(type) {
        return (
          {
            gate: 'gate test',
            edge: 'edge case',
            interaction: 'interaction',
            fidelity: 'fidelity',
          }[type] || type
        );
      }
      function dotClass(s) {
        return { pass: 'dot-pass', fail: 'dot-fail', skip: 'dot-skip' }[s] || 'dot-untested';
      }
      function listHTML(items, tag, cls) {
        return `<${tag}${cls ? ` class="${cls}"` : ''}>${(items || []).map((i) => `<li>${i}</li>`).join('')}</${tag}>`;
      }
      let toastTimer;
      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
      }

      // ── Render ─────────────────────────────────────────────────
      function render() {
        const testMap = {};
        TESTS.forEach((t) => {
          testMap[t.id] = t;
        });

        const main = document.getElementById('main');
        main.querySelectorAll('.group').forEach((el) => el.remove());

        GROUPS.forEach((group, gi) => {
          const isFirst = gi === 0;
          const section = document.createElement('div');
          section.className = 'group';
          section.innerHTML = `
        <div class="group-header">
          <span class="group-title">${escHtml(group.title)}</span>
          <div class="group-meta" data-group-meta="${gi}"></div>
        </div>
        <div class="group-body ${isFirst ? 'open' : ''}"></div>`;

          const body = section.querySelector('.group-body');
          group.ids.forEach((id) => {
            const t = testMap[id];
            if (t) body.appendChild(buildCard(t));
          });
          main.appendChild(section);

          updateGroupMetaByIndex(gi, isFirst);

          section.querySelector('.group-header').addEventListener('click', () => {
            section.querySelector('.group-body').classList.toggle('open');
            const chev = section.querySelector('.group-chevron');
            if (chev) chev.classList.toggle('open');
          });
        });

        updateSummary();
      }

      function buildCard(t) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = t.id;

        const badges = [
          `<span class="badge ${typeBadgeClass(t.type)}">${typeLabel(t.type)}</span>`,
          t.isNew ? `<span class="badge badge-new">new</span>` : '',
          t.defect ? `<span class="badge badge-defect">${escHtml(t.defect)}</span>` : '',
          t.auto_covered ? `<span class="badge badge-auto">AUTO ✓</span>` : '',
          t.needsHA ? `<span class="badge badge-ha">live HA</span>` : '',
        ].join('');

        const prevStatus = PREV[t.id] || 'untested';
        const autoBanner = t.auto_covered
          ? `<div class="auto-note"><strong>Automated coverage confirms</strong>${t.auto_note || ''}</div>`
          : '';
        const haBanner = t.needsHA
          ? `<div class="ha-warn"><strong>⚠ Live Home Assistant.</strong> Temporary dashboard only. Teardown is a
         required step on this card — see <code>docs/testing/UAT_STRATEGY.md</code> §10.</div>`
          : '';

        card.innerHTML = `
      <div class="card-header">
        <span class="card-id">${escHtml(t.id)}</span>
        ${badges}
        <span class="card-name">${escHtml(t.name)}</span>
        <span class="status-dot ${dotClass(state[t.id])}" data-dot="${t.id}" title="This round"></span>
        <span class="status-dot-prev ${dotClass(prevStatus)}" title="Previous round: ${prevStatus}"></span>
      </div>
      <div class="card-body">
        ${autoBanner}${haBanner}
        <div class="card-section-label">Steps</div>
        ${listHTML(t.steps, 'ol')}
        <div class="card-section-label">Expected</div>
        ${listHTML(t.expects, 'ul', 'expects')}
        <div class="card-section-label">Notes</div>
        <textarea placeholder="What did you actually observe? Observed vs expected." data-notes="${t.id}">${escHtml(notes[t.id] || '')}</textarea>
        <div class="severity-row" data-severity-row="${t.id}">
          <label for="sev-${t.id}">Severity</label>
          <select id="sev-${t.id}" data-severity="${t.id}">
            <option value="">— choose —</option>
            <option value="high">High — data loss, blocked workflow, crash, unwanted HA write</option>
            <option value="medium">Medium — wrong output, silent lossy translation, stale dialog</option>
            <option value="low">Low — cosmetic, wording, minor convenience</option>
          </select>
          <span class="severity-hint">Required on every Fail — the acceptance bar is severity-driven.</span>
        </div>
        <div class="card-section-label">Screenshot</div>
        <div class="screenshot-zone" data-screenshot-zone="${t.id}">
          <label>📎 Click to browse, or open this card and paste from the clipboard</label>
          <input type="file" accept="image/*" class="screenshot-file-input" />
          <div class="screenshot-preview" style="display:none;">
            <img class="screenshot-img" alt="Screenshot for ${escHtml(t.id)}" />
            <button class="screenshot-remove">✕ Remove</button>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-verdict btn-pass" data-verdict="pass">Pass</button>
          <button class="btn-verdict btn-fail" data-verdict="fail">Fail</button>
          <button class="btn-verdict btn-skip" data-verdict="skip">Skip</button>
        </div>
      </div>`;

        card.querySelector('.card-header').addEventListener('click', () => {
          card.querySelector('.card-body').classList.toggle('open');
        });

        card.querySelector(`textarea[data-notes="${t.id}"]`).addEventListener('input', (e) => {
          notes[t.id] = e.target.value;
          persistNotes();
        });

        const sevSelect = card.querySelector(`select[data-severity="${t.id}"]`);
        sevSelect.value = severity[t.id] || '';
        sevSelect.addEventListener('change', (e) => {
          if (e.target.value) severity[t.id] = e.target.value;
          else delete severity[t.id];
          persistSeverity();
          updateSummary();
        });
        sevSelect.addEventListener('click', (e) => e.stopPropagation());

        const fileInput = card.querySelector('.screenshot-file-input');
        fileInput.addEventListener('change', (e) => {
          if (e.target.files[0]) attachScreenshot(t.id, e.target.files[0], card);
        });
        card.querySelector('.screenshot-remove').addEventListener('click', (e) => {
          e.stopPropagation();
          clearScreenshot(t.id, card);
        });
        if (screenshots[t.id]) showScreenshotPreview(t.id, screenshots[t.id], card);

        card.querySelectorAll('.btn-verdict').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const verdict = btn.dataset.verdict;
            state[t.id] = verdict;
            if (verdict !== 'fail') {
              delete severity[t.id];
              persistSeverity();
            }
            persistCurrent();
            refreshCard(t.id);
            updateGroupMeta(t.id);
            updateSummary();
          });
        });

        applyVerdictUI(card, t.id);
        return card;
      }

      function applyVerdictUI(card, id) {
        const verdict = state[id] || 'untested';
        card.querySelectorAll('.btn-verdict').forEach((b) => {
          b.classList.toggle('active', b.dataset.verdict === verdict);
        });
        const dot = card.querySelector(`.status-dot[data-dot="${id}"]`);
        if (dot) dot.className = `status-dot ${dotClass(verdict)}`;
        const sevRow = card.querySelector(`[data-severity-row="${id}"]`);
        if (sevRow) sevRow.classList.toggle('show', verdict === 'fail');
        const sevSelect = card.querySelector(`select[data-severity="${id}"]`);
        if (sevSelect) sevSelect.value = severity[id] || '';
      }
      function refreshCard(id) {
        const card = document.querySelector(`.card[data-id="${id}"]`);
        if (card) applyVerdictUI(card, id);
      }

      // ── Screenshots ────────────────────────────────────────────
      function attachScreenshot(testId, file, cardEl) {
        const reader = new FileReader();
        reader.onload = (e) => {
          screenshots[testId] = e.target.result;
          persistScreenshots();
          showScreenshotPreview(testId, e.target.result, cardEl);
        };
        reader.readAsDataURL(file);
      }
      function showScreenshotPreview(testId, dataUrl, cardEl) {
        const zone = cardEl.querySelector(`[data-screenshot-zone="${testId}"]`);
        if (!zone) return;
        zone.querySelector('.screenshot-img').src = dataUrl;
        zone.querySelector('.screenshot-preview').style.display = 'block';
        const label = zone.querySelector('label');
        if (label) label.style.display = 'none';
      }
      function clearScreenshot(testId, cardEl) {
        delete screenshots[testId];
        persistScreenshots();
        const zone = cardEl.querySelector(`[data-screenshot-zone="${testId}"]`);
        if (!zone) return;
        zone.querySelector('.screenshot-img').src = '';
        zone.querySelector('.screenshot-preview').style.display = 'none';
        const label = zone.querySelector('label');
        if (label) label.style.display = '';
        const fi = zone.querySelector('.screenshot-file-input');
        if (fi) fi.value = '';
      }
      document.addEventListener('paste', (e) => {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        let imageFile = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.startsWith('image/')) {
            imageFile = items[i].getAsFile();
            break;
          }
        }
        if (!imageFile) return;
        const openBody = document.querySelector('.card-body.open');
        if (!openBody) {
          showToast('Open a test card first, then paste your screenshot.');
          return;
        }
        const card = openBody.closest('.card');
        if (card && card.dataset.id) attachScreenshot(card.dataset.id, imageFile, card);
      });

      // ── Counters ───────────────────────────────────────────────
      function updateGroupMeta(changedId) {
        GROUPS.forEach((g, gi) => {
          if (g.ids.includes(changedId)) updateGroupMetaByIndex(gi);
        });
      }
      function updateGroupMetaByIndex(gi, forceOpen) {
        const counts = { pass: 0, fail: 0, skip: 0, untested: 0 };
        GROUPS[gi].ids.forEach((id) => {
          counts[state[id] || 'untested']++;
        });
        const meta = document.querySelector(`[data-group-meta="${gi}"]`);
        if (!meta) return;
        const existing = meta.querySelector('.group-chevron');
        const isOpen =
          forceOpen !== undefined ? forceOpen : existing && existing.classList.contains('open');
        meta.innerHTML = `
      <span style="color:var(--color-pass)">${counts.pass}✓</span>
      <span style="color:var(--color-fail)">${counts.fail}✗</span>
      <span style="color:var(--color-skip)">${counts.skip}⊘</span>
      <span style="color:var(--color-untested)">${counts.untested}○</span>
      <span class="group-chevron ${isOpen ? 'open' : ''}">▶</span>`;
      }

      function tally() {
        const c = {
          pass: 0,
          fail: 0,
          skip: 0,
          untested: 0,
          high: 0,
          medium: 0,
          low: 0,
          unrated: 0,
        };
        TESTS.forEach((t) => {
          const s = state[t.id] || 'untested';
          c[s]++;
          if (s === 'fail') {
            const sev = severity[t.id];
            if (sev) c[sev]++;
            else c.unrated++;
          }
        });
        return c;
      }

      function updateSummary() {
        const c = tally();
        document.getElementById('cnt-total').textContent = TESTS.length;
        document.getElementById('cnt-pass').textContent = c.pass;
        document.getElementById('cnt-fail').textContent = c.fail;
        document.getElementById('cnt-skip').textContent = c.skip;
        document.getElementById('cnt-untested').textContent = c.untested;

        // Acceptance bar — amendment-03 §3.1 / UAT_STRATEGY.md §11
        const chip = document.getElementById('acceptance-chip');
        const blockers = [];
        if (c.untested > 0) blockers.push(`${c.untested} untested`);
        if (c.high > 0) blockers.push(`${c.high} High`);
        if (c.unrated > 0) blockers.push(`${c.unrated} unrated fail`);
        if (blockers.length === 0) {
          chip.className = 'ok';
          chip.textContent =
            c.medium > 0 ? `Accept-able — ${c.medium} Medium need sign-off` : 'Bar met';
        } else {
          chip.className = 'blocked';
          chip.textContent = 'Blocked: ' + blockers.join(', ');
        }
      }

      // ── Runs panel events ──────────────────────────────────────
      document.getElementById('runs-panel-header').addEventListener('click', () => {
        document.getElementById('runs-panel-body').classList.toggle('open');
        document.getElementById('runs-chevron').classList.toggle('open');
      });
      document.getElementById('btn-save-run').addEventListener('click', () => {
        const input = document.getElementById('run-name-input');
        saveCurrentRun(input.value.trim());
        input.value = '';
      });
      document.getElementById('btn-export').addEventListener('click', exportJSON);
      document.getElementById('import-file-input').addEventListener('change', (e) => {
        if (e.target.files[0]) {
          importJSON(e.target.files[0]);
          e.target.value = '';
        }
      });
      document.getElementById('btn-clear-state').addEventListener('click', () => {
        if (!confirm('Clear all current results? Saved runs are not affected.')) return;
        replaceAllState({}, {}, {}, {});
        showToast('All results cleared.');
      });

      // ── Live-HA teardown gate (UAT_STRATEGY.md §10) ────────────
      function teardownGatePassed() {
        const haTouched = TESTS.some(
          (t) => t.needsHA && (state[t.id] || 'untested') !== 'untested',
        );
        if (!haTouched) return true;
        if (localStorage.getItem(KEY_TEARDOWN) === 'true') return true;
        const ok = confirm(
          'LIVE HOME ASSISTANT TEARDOWN CHECK\n\n' +
            'This round ran at least one test against the live Home Assistant instance.\n\n' +
            'Confirm the temporary dashboard has been DELETED from Home Assistant.\n\n' +
            'OK = confirmed deleted.  Cancel = go and remove it first.',
        );
        if (ok) localStorage.setItem(KEY_TEARDOWN, 'true');
        return ok;
      }

      // ── Summary report ─────────────────────────────────────────
      document.getElementById('defect-summary-btn').addEventListener('click', () => {
        if (!teardownGatePassed()) {
          showToast('Report blocked — remove the temporary Home Assistant dashboard first.');
          return;
        }

        const ts = new Date().toISOString();
        const date = ts.slice(0, 10);
        const c = tally();

        const bucket = { pass: [], fail: [], skip: [], untested: [] };
        TESTS.forEach((t) => bucket[state[t.id] || 'untested'].push(t));

        const row = (...cols) => '| ' + cols.join(' | ') + ' |';
        const sep = (n) => '|' + ' --- |'.repeat(n);
        const noteFor = (id) =>
          (notes[id] || '').replace(/\|/g, '\\|').replace(/\n/g, ' ').trim() || '—';
        const sevFor = (id) =>
          severity[id] ? severity[id][0].toUpperCase() + severity[id].slice(1) : '**UNRATED**';
        const shotFor = (id) => (screenshots[id] ? 'yes' : 'no');

        const lines = [
          `# UAT Test Summary Report — ${ROUND_ID}: ${ROUND_NAME}`,
          '',
          `**Generated:** ${ts}`,
          `**Build under test:** ${BUILD_UNDER_TEST}`,
          `**Test plan:** \`${PLAN_PATH}\``,
          '',
          '## Summary',
          '',
          row('Total', 'Pass', 'Fail', 'Skip', 'Untested'),
          sep(5),
          row(TESTS.length, c.pass, c.fail, c.skip, c.untested),
          '',
          '### Defects by severity',
          '',
          row('High', 'Medium', 'Low', 'Unrated'),
          sep(4),
          row(c.high, c.medium, c.low, c.unrated),
          '',
          '## Acceptance check',
          '',
          'Against `phase-7-ecosystem-future-growth-amendment-03.md` §3.1 / `UAT_STRATEGY.md` §11:',
          '',
          row('Criterion', 'Result'),
          sep(2),
          row('Zero open High-severity defects', c.high === 0 ? '✅ met' : `❌ ${c.high} open`),
          row('No test left Untested', c.untested === 0 ? '✅ met' : `❌ ${c.untested} untested`),
          row('Every Fail has a severity', c.unrated === 0 ? '✅ met' : `❌ ${c.unrated} unrated`),
          row(
            'Mediums fixed or accepted with rationale',
            c.medium === 0
              ? '✅ none raised'
              : `⚠ ${c.medium} require written sign-off in the release notes`,
          ),
          row(
            'Uncovered failures gain regression tests',
            bucket.fail.filter((t) => !t.auto_covered).length === 0
              ? '✅ none'
              : `⚠ ${bucket.fail.filter((t) => !t.auto_covered).length} require new coverage`,
          ),
          '',
          '## Failed tests',
          '',
        ];

        if (bucket.fail.length === 0) {
          lines.push('_None._', '');
        } else {
          lines.push(
            row('ID', 'Name', 'Type', 'Severity', 'Regression?', 'Screenshot', 'Observed'),
            sep(7),
            ...bucket.fail.map((t) =>
              row(
                t.id,
                t.name,
                typeLabel(t.type),
                sevFor(t.id),
                PREV[t.id] === 'pass' ? '**YES**' : 'no',
                shotFor(t.id),
                noteFor(t.id),
              ),
            ),
            '',
          );
        }

        lines.push('## Failed tests without automated coverage', '');
        const uncovered = bucket.fail.filter((t) => !t.auto_covered);
        if (uncovered.length === 0) {
          lines.push('_None._', '');
        } else {
          lines.push(
            'Each fix **must** add automated coverage — `UAT_STRATEGY.md` §7 regression mandate.',
            '',
            row('ID', 'Name', 'Type', 'Severity'),
            sep(4),
            ...uncovered.map((t) => row(t.id, t.name, typeLabel(t.type), sevFor(t.id))),
            '',
          );
        }

        lines.push('## Skipped tests', '');
        if (bucket.skip.length === 0) lines.push('_None._', '');
        else
          lines.push(
            row('ID', 'Name', 'Reason'),
            sep(3),
            ...bucket.skip.map((t) => row(t.id, t.name, noteFor(t.id))),
            '',
          );

        lines.push('## Untested', '');
        if (bucket.untested.length === 0) lines.push('_None — every test has a verdict._', '');
        else
          lines.push(
            '⚠ A test with no verdict is not a decision. Mark it Skip with a reason.',
            '',
            row('ID', 'Name'),
            sep(2),
            ...bucket.untested.map((t) => row(t.id, t.name)),
            '',
          );

        lines.push('## Passed tests', '', row('ID', 'Name', 'Type', 'Notes'), sep(4));
        if (bucket.pass.length === 0) lines.push(row('—', '_None_', '—', '—'));
        else
          bucket.pass.forEach((t) =>
            lines.push(row(t.id, t.name, typeLabel(t.type), noteFor(t.id))),
          );
        lines.push('');

        const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `uat_summary_${ROUND_ID}_${date}.md`;
        a.click();
        showToast('Report downloaded — commit it to docs/testing/uat/reports/');
      });

      // ── Issues payload ─────────────────────────────────────────
      document.getElementById('issues-script-btn').addEventListener('click', () => {
        const failed = TESTS.filter((t) => (state[t.id] || 'untested') === 'fail');
        if (!failed.length) {
          showToast('No failed tests — nothing to generate.');
          return;
        }
        const date = new Date().toISOString().slice(0, 10);
        const esc = (s) => String(s || '').replace(/'/g, "'\\''");

        const lines = [
          '#!/usr/bin/env bash',
          '# ============================================================',
          `# GitHub Issues payload — HAVDM UAT ${ROUND_ID} (${date})`,
          '#',
          '# ⚠ REVIEW BEFORE RUNNING. Creating issues is outward-facing and',
          "#   requires the project owner's explicit authorisation.",
          '# ⚠ NOT IDEMPOTENT — search existing issues for the test ID first:',
          `#   https://github.com/${REPO}/issues`,
          '# ============================================================',
          'set -euo pipefail',
          '',
        ];

        failed.forEach((t) => {
          const labels = ['defect', `severity:${severity[t.id] || 'unrated'}`];
          if (PREV[t.id] === 'pass') labels.push('regression');

          const body = [
            '## Defect summary',
            `**Test ID:** ${t.id}`,
            `**Test:** ${t.name}`,
            `**UAT round:** ${ROUND_ID} — ${date}`,
            `**Severity:** ${severity[t.id] || 'UNRATED'}`,
            `**Regression:** ${PREV[t.id] === 'pass' ? 'YES — passed in the previous round' : 'no'}`,
            '',
            '## Observed',
            (notes[t.id] || '').trim() || '_No notes recorded._',
            '',
            '## Expected',
            (t.expects || []).map((e) => `- ${e.replace(/<[^>]+>/g, '')}`).join('\n') ||
              '_None recorded._',
            '',
            '## Steps to reproduce',
            (t.steps || []).map((s, i) => `${i + 1}. ${s.replace(/<[^>]+>/g, '')}`).join('\n') ||
              '_None recorded._',
            '',
            '## Screenshot',
            screenshots[t.id] ? 'Attached in the UAT session JSON.' : '_None recorded._',
            '',
            '## Automated coverage',
            t.auto_covered
              ? `Yes — ${(t.auto_note || '').replace(/<[^>]+>/g, '')}`
              : '**No — a regression test is REQUIRED as part of the fix (UAT_STRATEGY.md §7).**',
            '',
            '## References',
            `- Plan: \`${PLAN_PATH}\``,
            `- Report: \`docs/testing/uat/reports/uat_summary_${ROUND_ID}_${date}.md\``,
          ].join('\n');

          lines.push(
            `# ${t.id}: ${t.name}`,
            'gh issue create \\',
            `  --repo ${REPO} \\`,
            `  --title '[UAT ${ROUND_ID}] ${esc(t.id)}: ${esc(t.name)}' \\`,
            `  --label '${labels.join(',')}' \\`,
            `  --body '${esc(body)}'`,
            '',
          );
        });

        const blob = new Blob([lines.join('\n')], { type: 'text/x-shellscript' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `uat_issues_${ROUND_ID}_${date}.sh`;
        a.click();
        showToast(`Issues payload downloaded — ${failed.length} defect(s). Review before running.`);
      });

      // ── Init ───────────────────────────────────────────────────
      document.getElementById('round-label').textContent = `${ROUND_ID} — ${ROUND_NAME}`;
      document.getElementById('round-sub').textContent = BUILD_UNDER_TEST;
      document.title = `HAVDM UAT — ${ROUND_ID}`;
      initState();
      render();
      renderRunsList();
    </script>
  </body>
</html>
